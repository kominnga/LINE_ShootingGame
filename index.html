<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>LINE Shooting</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

    <div id="game-container">

        <canvas id="gameCanvas"></canvas>

        <div id="hud">
            <div>SCORE <span id="score">0</span></div>
            <div>HP <span id="hp">3</span></div>
        </div>

        <div id="start-screen">
            <h1>LINE SHOOTING</h1>
            <p>敵を撃ち落とせ！</p>
            <button id="start-button">START</button>
            <button id="ranking-button">🏆 RANKING</button>
            <button id="garage-button">🚀 GARAGE</button>
        </div>

        <div id="game-over-screen">
    <h1>GAME OVER</h1>

    <!-- LINEプロフィール -->
    <div id="line-profile">

        <img
            id="line-profile-image"
            src=""
            alt="LINEプロフィール画像"
        >

        <div id="line-profile-name">
            ゲスト
        </div>

    </div>

    <!-- スコア -->
    <p>SCORE</p>
    <div id="final-score">0</div>

    <button id="restart-button">RESTART</button>

    <button id="return-start-button">🏠 スタートへ</button>

    <button id="share-button">LINEでシェア</button>

    <button id="ranking-button-gameover">🏆 RANKING</button>
</div>
<!-- ランキング画面 -->
<div id="ranking-screen">

    <div id="ranking-panel">

        <h1>🏆 RANKING</h1>

        <div id="ranking-list">

            <div class="ranking-loading">
                RANKING LOADING...
            </div>

        </div>

        <button id="ranking-close-button">
            CLOSE
        </button>

    </div>

</div>
<!-- GARAGE -->
<div id="garage-screen">

    <div id="garage-panel">

        <h1>🚀 NEXUS GARAGE</h1>

        <div id="garage-preview">

            <button id="skin-prev" class="skin-arrow">
                ◀
            </button>

            <div id="skin-display">

                <canvas
                    id="skin-preview-canvas"
                    width="180"
                    height="220">
                </canvas>

                <div id="skin-name">
                    NEXUS-01
                </div>

                <div id="skin-number">
                    1 / 5
                </div>

            </div>

            <button id="skin-next" class="skin-arrow">
                ▶
            </button>

        </div>

        <button id="skin-equip-button">
            装備する
        </button>

        <div id="skin-status">
            装備中：NEXUS-01
        </div>

        <button id="garage-close-button">
            戻る
        </button>

         <div id="skin-number">1 / 5</div>   
 <div id="skin-type">
    STANDARD TYPE
</div>

<div id="skin-description">
    バランスに優れた標準型機体。
</div>

<div id="skin-ability">
    ABILITY：標準性能
</div>   

    </div>

</div>


        <div id="controls">
            <button id="left-button">◀</button>

            <button id="fire-button">🔥</button>

            <button id="right-button">▶</button>
        </div>

        <div id="itemControls">

     

    <button id="healButton">
        ♡
        <span>回復</span>
    </button>

    <button id="beamButton">
        🌈
        <span>BEAM</span>
    </button>

</div>

    </div>

    <script src="game.js"></script>

</body>
</html>
